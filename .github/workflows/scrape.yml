name: Scrape SOLV results

on:
  schedule:
    - cron: "0 6 * * 0,1,4,6"  # Sun, Mon, Thu, Sat at 06:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: "Year to scrape (also downloads previous year)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run scraper
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then
            YEAR=$(date +%Y)
          fi
          python -m solv_scraper --year "$YEAR"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded-data/ aggregated-data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SOLV results ($(date +%Y-%m-%d))"
            git push
          fi
